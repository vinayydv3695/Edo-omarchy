# Use a newline for a cleaner look between commands
add_newline = true

# LOGIC: 
# Line 1: [OS][Directory][Git Details] --- [Cmd Duration][Languages][Cloud]
# Line 2: [Character]
format = """
$os\
$directory\
$git_branch\
$git_status\
$git_state\
$fill\
$cmd_duration\
$golang\
$python\
$nodejs\
$rust\
$java\
$aws\
$docker_context\
$kubernetes\
$line_break\
$sudo\
$jobs\
$character"""

[fill]
symbol = " "

[character]
success_symbol = '[➜](bold green) ' 
error_symbol = '[➜](bold red) '
vicmd_symbol = '[](bold yellow) '

[directory]
style = "bold italic cyan"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
format = '[$path]($style)[$read_only]($read_only_style) '

# --- GIT ---

[git_branch]
symbol = " "
style = "bold magenta"
format = 'on [$symbol$branch]($style) '

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

# --- EXECUTION INFO ---

[cmd_duration]
min_time = 500
show_milliseconds = false
format = 'took [󱎫 $duration]($style) '
style = "bold yellow"

[jobs]
symbol = "󱖏 "
number_threshold = 1
format = '[$symbol$number]($style) '

[sudo]
symbol = "󰀶 "
disabled = false
format = '[$symbol]($style) '

# --- LANGUAGES ---

[golang]
symbol = " "
style = "bold cyan"
format = 'via [$symbol($version )]($style)'

[python]
symbol = " "
style = "bold yellow"
format = 'via [$symbol($version )]($style)'

[nodejs]
symbol = " "
style = "bold green"
format = 'via [$symbol($version )]($style)'

[rust]
symbol = " "
style = "bold orange"
format = 'via [$symbol($version )]($style)'

[java]
symbol = " "
style = "bold red"
format = 'via [$symbol($version )]($style)'

# --- CLOUD & DEVOPS ---

[aws]
symbol = " "
style = "bold yellow"
# FIXED: Using literal single quotes to handle parentheses/backslashes correctly
format = 'on [$symbol($profile )(\($region\) )]($style)'

[docker_context]
symbol = " "
style = "bold blue"
format = 'on [$symbol$context]($style) '

[kubernetes]
symbol = "☸ "
disabled = false
style = "bold blue"
format = 'at [$symbol$context( \($namespace\))]($style) '

